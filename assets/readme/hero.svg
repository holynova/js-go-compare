<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%">
  <title>JS vs Go 对比学习手册 — JavaScript and Go side by side</title>
  <desc>Light editorial hero: JS yellow and Go cyan code panels side by side with a VS badge, 42 lessons across 16 chapters.</desc>
  <defs>
    <linearGradient id="paper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbfaf7"/>
      <stop offset="100%" stop-color="#f1efe9"/>
    </linearGradient>
  </defs>
  <g>
    <rect width="1200" height="440" rx="16" fill="#f8f6f1"/>
    <rect width="1200" height="440" rx="16" fill="none" stroke="#e2ded4" stroke-width="1.5"/>
  </g>
  <!-- left copy -->
  <g>
    <g>
      <rect x="60" y="52" width="196" height="32" rx="16" fill="#111827"/>
      <text x="158" y="74" text-anchor="middle" font-family="'SF Mono', Monaco, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="2" fill="#f7df1e">JS ✕ GO · 对比学习</text>
    </g>
    <text x="60" y="152" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="56" font-weight="800" fill="#111827">JS vs Go</text>
    <text x="60" y="206" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="56" font-weight="800" fill="#111827">对比学习手册</text>
    <text x="60" y="252" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" fill="#4b5563">同一需求，两种写法，并排看清差异</text>
    <g font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700">
      <g>
        <rect x="60" y="288" width="110" height="44" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
        <text x="115" y="317" text-anchor="middle" fill="#111827">42 课</text>
      </g>
      <g>
        <rect x="186" y="288" width="110" height="44" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
        <text x="241" y="317" text-anchor="middle" fill="#111827">16 章</text>
      </g>
      <g>
        <rect x="312" y="288" width="200" height="44" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
        <text x="412" y="317" text-anchor="middle" fill="#111827">入门 20 · 进阶 16 · 高级 6</text>
      </g>
    </g>
    <text x="60" y="382" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#5f6875">语法 · 类型 · 并发 · 生态 · 工程判断，学完能选、能写、能迁移</text>
  </g>
  <!-- right: two code panels -->
  <g font-family="'SF Mono', Monaco, Consolas, monospace">
    <!-- JS panel -->
    <g transform="translate(600, 56)">
      <rect x="0" y="0" width="252" height="328" rx="12" fill="#1a1d29"/>
      <g>
        <rect x="0" y="0" width="252" height="40" rx="12" fill="#f7df1e"/>
        <rect x="0" y="20" width="252" height="20" fill="#f7df1e"/>
        <text x="16" y="27" font-size="16" font-weight="700" fill="#111827">JavaScript</text>
        <text x="236" y="27" text-anchor="end" font-size="16" font-weight="700" fill="#111827">JS</text>
      </g>
      <text x="16" y="76" font-size="16" fill="#e5e7eb"><tspan fill="#f472b6">const</tspan> user = { id: <tspan fill="#fbbf24">1</tspan>,</text>
      <text x="16" y="102" font-size="16" fill="#e5e7eb">  name: <tspan fill="#a7f3d0">"Ada"</tspan> };</text>
      <text x="16" y="128" font-size="16" fill="#e5e7eb">user.role = <tspan fill="#a7f3d0">"admin"</tspan>;</text>
      <text x="16" y="168" font-size="16" fill="#e5e7eb"><tspan fill="#f472b6">function</tspan> <tspan fill="#93c5fd">greet</tspan>(t) {</text>
      <text x="16" y="194" font-size="16" fill="#e5e7eb">  <tspan fill="#f472b6">return</tspan> <tspan fill="#a7f3d0">"hi "</tspan> + t.name;</text>
      <text x="16" y="220" font-size="16" fill="#e5e7eb">}</text>
      <text x="16" y="268" font-size="15" fill="#9ca3af">// 运行时继续变形</text>
      <text x="16" y="292" font-size="15" fill="#9ca3af">// 灵活表达</text>
    </g>
    <!-- Go panel -->
    <g transform="translate(884, 56)">
      <rect x="0" y="0" width="252" height="328" rx="12" fill="#1a1d29"/>
      <g>
        <rect x="0" y="0" width="252" height="40" rx="12" fill="#00add8"/>
        <rect x="0" y="20" width="252" height="20" fill="#00add8"/>
        <text x="16" y="27" font-size="16" font-weight="700" fill="#062a33">Go</text>
        <text x="236" y="27" text-anchor="end" font-size="16" font-weight="700" fill="#062a33">GO</text>
      </g>
      <text x="16" y="76" font-size="16" fill="#e5e7eb"><tspan fill="#67e8f9">type</tspan> User <tspan fill="#67e8f9">struct</tspan> {</text>
      <text x="16" y="102" font-size="16" fill="#e5e7eb">  ID   <tspan fill="#fbbf24">int</tspan></text>
      <text x="16" y="128" font-size="16" fill="#e5e7eb">  Name <tspan fill="#fbbf24">string</tspan></text>
      <text x="16" y="154" font-size="16" fill="#e5e7eb">}</text>
      <text x="16" y="194" font-size="16" fill="#e5e7eb"><tspan fill="#67e8f9">func</tspan> <tspan fill="#93c5fd">Greet</tspan>(u User)</text>
      <text x="16" y="220" font-size="16" fill="#e5e7eb">  <tspan fill="#fbbf24">string</tspan> { <tspan fill="#67e8f9">return</tspan></text>
      <text x="16" y="246" font-size="16" fill="#e5e7eb">  <tspan fill="#a7f3d0">"hi "</tspan> + u.Name }</text>
      <text x="16" y="292" font-size="15" fill="#9ca3af">// 先声明形状，再检查</text>
      <text x="16" y="316" font-size="15" fill="#9ca3af">// 简洁约束</text>
    </g>
    <!-- VS badge -->
    <g>
      <rect x="848" y="200" width="40" height="40" fill="#111827"/>
      <circle cx="868" cy="220" r="30" fill="#111827" stroke="#ffffff" stroke-width="3"/>
      <text x="868" y="228" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">VS</text>
    </g>
  </g>
</svg>
