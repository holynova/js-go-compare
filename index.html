<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JS vs Go 对比学习手册</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    :root {
      --bg-slate-900: #0f172a;
      --bg-slate-950: #020617;
      --surface-white: #ffffff;
      --surface-slate-50: #f8fafc;
      --surface-slate-100: #f1f5f9;
      --border-slate-200: #e2e8f0;
      --border-slate-700: #334155;
      --text-slate-50: #f8fafc;
      --text-slate-900: #0f172a;
      --text-slate-700: #334155;
      --text-slate-500: #64748b;
      --text-slate-400: #94a3b8;
      --indigo-500: #6366f1;
      --indigo-600: #4f46e5;
      --sky-400: #38bdf8;
      --emerald-500: #10b981;
      --amber-500: #f59e0b;
      --rose-500: #f43f5e;
      --radius-md: 6px;
      --radius-lg: 8px;
      --radius-xl: 12px;
      --shadow-sm: 0 1px 2px 0 rgba(15, 23, 42, 0.05);
      --shadow: 0 1px 3px 0 rgba(15, 23, 42, 0.1), 0 1px 2px -1px rgba(15, 23, 42, 0.1);
      --shadow-lg: 0 10px 15px -3px rgba(15, 23, 42, 0.1), 0 4px 6px -4px rgba(15, 23, 42, 0.1);
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 88px;
    }

    body {
      margin: 0;
      background: var(--surface-slate-50);
      background-size: 24px 24px;
      color: var(--text-slate-900);
      font-family: var(--sans);
      letter-spacing: 0;
    }

    button, input, select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid var(--border-slate-200);
      background: rgba(255, 255, 255, .92);
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow-sm);
    }

    .topbar {
      display: grid;
      grid-template-columns: auto minmax(220px, 1fr) auto;
      gap: 14px;
      align-items: center;
      max-width: 1560px;
      min-height: 72px;
      margin: 0 auto;
      padding: 12px 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 218px;
    }

    .topbar {
      grid-template-columns: minmax(0, 1fr) auto;
    }

    .repo-link {
      display: inline-flex;
      align-items: center;
      min-height: 38px;
      border: 1px solid var(--border-slate-200);
      border-radius: var(--radius-lg);
      background: var(--surface-white);
      color: var(--text-slate-900);
      font-size: 14px;
      font-weight: 700;
      line-height: 20px;
      padding: 0 14px;
      text-decoration: none;
      box-shadow: var(--shadow-sm);
    }

    .repo-link:hover {
      border-color: var(--indigo-500);
      color: var(--indigo-600);
    }

    .mark {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border: 1px solid var(--border-slate-200);
      border-radius: var(--radius-lg);
      background: var(--bg-slate-900);
      color: var(--sky-400);
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 800;
    }

    .brand h1 {
      margin: 0;
      font-size: 16px;
      line-height: 1.1;
      font-weight: 800;
    }

    .brand p {
      margin: 3px 0 0;
      color: var(--text-slate-500);
      font-size: 12px;
    }

    .search-row {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) 150px 150px 150px;
      gap: 8px;
      align-items: center;
    }

    .field,
    .select {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--border-slate-200);
      border-radius: var(--radius-lg);
      background: var(--surface-white);
      color: var(--text-slate-900);
      outline: none;
      box-shadow: var(--shadow-sm);
    }

    .field {
      padding: 0 12px;
    }

    .select {
      padding: 0 10px;
    }

    .field:focus,
    .select:focus {
      border-color: var(--indigo-500);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, .18);
    }

    .toolbar-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .btn {
      min-height: 42px;
      border: 1px solid var(--border-slate-200);
      border-radius: var(--radius-lg);
      background: var(--surface-white);
      color: var(--text-slate-900);
      padding: 0 12px;
      white-space: nowrap;
      box-shadow: var(--shadow-sm);
      transition: transform 150ms ease-in-out, border-color 150ms ease-in-out, background 150ms ease-in-out;
    }

    .btn:hover {
      border-color: var(--indigo-500);
    }

    .btn:active {
      transform: scale(.98);
    }

    .btn.primary {
      border-color: var(--indigo-600);
      background: var(--indigo-500);
      color: #fff;
    }

    .btn.primary:hover {
      background: var(--indigo-600);
    }

    .mobile-only {
      display: none;
    }

    .shell {
      display: grid;
      grid-template-columns: 248px minmax(0, 1fr) 286px;
      gap: 18px;
      max-width: 1560px;
      margin: 0 auto;
      padding: 18px;
    }

    .side,
    .right-rail {
      position: sticky;
      top: 91px;
      height: calc(100dvh - 110px);
      overflow: auto;
      align-self: start;
      border: 1px solid var(--border-slate-200);
      border-radius: var(--radius-xl);
      background: var(--surface-white);
      box-shadow: var(--shadow-sm);
    }

    .side-head,
    .rail-block {
      padding: 14px;
      border-bottom: 1px solid var(--border-slate-200);
    }

    .side-head strong,
    .rail-block h2,
    .section-title h2 {
      margin: 0;
      font-size: 13px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text-slate-700);
    }

    .side-head p,
    .rail-block p {
      margin: 6px 0 0;
      color: var(--text-slate-500);
      font-size: 12px;
      line-height: 1.45;
    }

    .toc {
      display: grid;
      padding: 8px;
      gap: 4px;
    }

    .toc button {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      width: 100%;
      min-height: 38px;
      border: 1px solid transparent;
      border-radius: var(--radius-lg);
      background: transparent;
      color: var(--text-slate-900);
      padding: 7px 8px;
      text-align: left;
      transition: background 150ms ease-in-out, border-color 150ms ease-in-out, transform 150ms ease-in-out;
    }

    .toc button:hover,
    .toc button.active {
      border-color: rgba(99, 102, 241, .28);
      background: rgba(99, 102, 241, .08);
    }

    .toc-num,
    .topic-count,
    .tag {
      font-family: var(--mono);
      font-size: 11px;
    }

    .toc-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
    }

    .main {
      min-width: 0;
    }

    .intro {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(280px, .85fr);
      gap: 18px;
      border: 1px solid var(--border-slate-200);
      border-radius: var(--radius-xl);
      background: var(--surface-white);
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: var(--shadow);
    }

    .intro h2 {
      max-width: 780px;
      margin: 0;
      font-size: clamp(30px, 5vw, 62px);
      line-height: .98;
      letter-spacing: 0;
      font-weight: 800;
    }

    .intro p {
      max-width: 68ch;
      margin: 14px 0 0;
      color: var(--text-slate-500);
      font-size: 15px;
      line-height: 1.75;
    }

    .intro-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      align-content: start;
    }

    .stat {
      min-height: 102px;
      border: 1px solid var(--border-slate-200);
      border-radius: var(--radius-xl);
      background: var(--surface-slate-50);
      padding: 12px;
    }

    .stat b {
      display: block;
      font-family: var(--mono);
      font-size: 24px;
      line-height: 1;
      color: var(--indigo-600);
    }

    .stat span {
      display: block;
      margin-top: 8px;
      color: var(--text-slate-500);
      font-size: 12px;
      line-height: 1.4;
    }

    .matrix {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 18px;
    }

    .matrix-cell {
      border: 1px solid var(--border-slate-200);
      border-radius: var(--radius-xl);
      background: var(--surface-white);
      padding: 12px;
      box-shadow: var(--shadow-sm);
    }

    .matrix-cell h3 {
      margin: 0 0 8px;
      font-size: 13px;
      color: var(--text-slate-900);
    }

    .matrix-cell p {
      margin: 0;
      color: var(--text-slate-500);
      font-size: 12px;
      line-height: 1.5;
    }

    .section {
      border: 1px solid var(--border-slate-200);
      border-radius: var(--radius-xl);
      background: var(--surface-white);
      margin-bottom: 18px;
      overflow: clip;
      box-shadow: var(--shadow);
    }

    .section-title {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: end;
      padding: 15px 16px;
      border-bottom: 1px solid var(--border-slate-200);
      background: linear-gradient(90deg, rgba(99, 102, 241, .08), rgba(56, 189, 248, .08));
    }

    .section-title p {
      margin: 6px 0 0;
      color: var(--text-slate-500);
      font-size: 13px;
      line-height: 1.45;
    }

    .cards {
      display: grid;
      gap: 0;
    }

    .topic {
      border-bottom: 1px solid var(--border-slate-200);
      padding: 16px;
    }

    .topic:last-child {
      border-bottom: 0;
    }

    .topic-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: start;
    }

    .topic h3 {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
    }

    .topic-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      border: 1px solid var(--border-slate-200);
      border-radius: 999px;
      background: var(--surface-slate-100);
      color: var(--text-slate-700);
      padding: 0 8px;
      white-space: nowrap;
    }

    .topic-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .complete-btn,
    .expand-btn {
      min-width: 94px;
      min-height: 34px;
      border: 1px solid var(--border-slate-200);
      border-radius: var(--radius-lg);
      background: var(--surface-white);
      color: var(--text-slate-900);
      font-weight: 600;
      transition: transform 150ms ease-in-out, border-color 150ms ease-in-out, background 150ms ease-in-out;
    }

    .expand-btn {
      min-width: 76px;
    }

    .complete-btn:hover,
    .expand-btn:hover {
      border-color: var(--indigo-500);
      background: rgba(99, 102, 241, .08);
    }

    .complete-btn:active,
    .expand-btn:active {
      transform: scale(.98);
    }

    .complete-btn.done {
      border-color: var(--emerald-500);
      background: var(--emerald-500);
      color: #fff;
    }

    .compare-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 10px;
      margin-top: 14px;
    }

    .code-card {
      min-width: 0;
      border: 1px solid var(--border-slate-700);
      border-radius: var(--radius-xl);
      overflow: hidden;
      background: var(--bg-slate-900);
      box-shadow: var(--shadow-lg);
    }

    .code-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 36px;
      border-bottom: 1px solid rgba(255, 255, 255, .12);
      padding: 0 10px;
      color: var(--text-slate-50);
      font-family: var(--mono);
      font-size: 12px;
      background: var(--bg-slate-950);
    }

    .lang-js { color: var(--amber-500); }
    .lang-go { color: var(--sky-400); }

    .copy {
      border: 1px solid rgba(255, 255, 255, .22);
      border-radius: var(--radius-md);
      background: transparent;
      color: var(--text-slate-50);
      padding: 4px 7px;
      font-size: 11px;
      transition: background 150ms ease-in-out, transform 150ms ease-in-out;
    }

    .copy:hover {
      background: rgba(255, 255, 255, .08);
    }

    pre {
      min-height: 148px;
      max-height: 230px;
      margin: 0;
      overflow: auto;
      padding: 12px;
      color: var(--text-slate-50);
      background: var(--bg-slate-900);
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.55;
      tab-size: 2;
    }

    pre code.hljs {
      padding: 0;
      background: transparent;
    }

    .topic.expanded pre {
      max-height: none;
    }

    .notes {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    .note {
      border: 1px solid var(--border-slate-200);
      border-radius: var(--radius-xl);
      background: var(--surface-slate-50);
      padding: 11px;
    }

    .note b {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text-slate-700);
    }

    .note p {
      margin: 0;
      color: var(--text-slate-500);
      font-size: 13px;
      line-height: 1.55;
    }

    .progress-wrap {
      display: grid;
      gap: 8px;
    }

    .progress-bar {
      height: 10px;
      border: 1px solid var(--border-slate-200);
      border-radius: 999px;
      background: var(--surface-slate-100);
      overflow: hidden;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      background: var(--emerald-500);
      transition: width .2s ease;
    }

    .progress-number {
      display: flex;
      justify-content: space-between;
      color: var(--text-slate-500);
      font-family: var(--mono);
      font-size: 12px;
    }

    .quick-list {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .quick-item {
      display: grid;
      grid-template-columns: 70px 1fr;
      gap: 8px;
      align-items: start;
      border-top: 1px solid var(--border-slate-200);
      padding-top: 8px;
      font-size: 12px;
      line-height: 1.4;
      color: var(--text-slate-700);
    }

    .quick-item code {
      color: var(--indigo-600);
      font-family: var(--mono);
      font-size: 11px;
    }

    .path {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .path-step {
      display: grid;
      grid-template-columns: 26px 1fr;
      gap: 8px;
      align-items: start;
      color: var(--text-slate-500);
      font-size: 12px;
      line-height: 1.45;
    }

    .path-step b {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      border: 1px solid var(--border-slate-200);
      border-radius: 50%;
      color: var(--text-slate-900);
      font-family: var(--mono);
      font-size: 11px;
    }

    .empty {
      border: 1px dashed var(--border-slate-200);
      border-radius: var(--radius-xl);
      background: var(--surface-white);
      padding: 28px;
      color: var(--text-slate-500);
      text-align: center;
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 30;
      border: 1px solid var(--indigo-600);
      border-radius: var(--radius-lg);
      background: var(--indigo-500);
      color: #fff;
      padding: 10px 12px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity .18s ease, transform .18s ease;
      pointer-events: none;
      font-size: 13px;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .backtop {
      position: fixed;
      right: 18px;
      bottom: 68px;
      z-index: 19;
      width: 42px;
      height: 42px;
      border: 1px solid var(--border-slate-200);
      border-radius: var(--radius-lg);
      background: var(--surface-white);
      color: var(--text-slate-900);
      box-shadow: var(--shadow);
    }

    .drawer {
      display: none;
    }

    @media (max-width: 1180px) {
      .topbar {
        grid-template-columns: 1fr;
      }

      .search-row {
        grid-template-columns: minmax(180px, 1fr) 1fr 1fr 1fr;
      }

      .toolbar-actions {
        justify-content: flex-start;
      }

      .shell {
        grid-template-columns: minmax(0, 1fr);
      }

      .side,
      .right-rail {
        display: none;
      }

      .mobile-only {
        display: inline-flex;
      }

      .intro {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 780px) {
      .topbar,
      .shell {
        padding: 12px;
      }

      .search-row {
        grid-template-columns: 1fr;
      }

      .brand {
        min-width: 0;
      }

      .intro {
        padding: 15px;
      }

      .intro-grid,
      .matrix,
      .compare-grid,
      .notes {
        grid-template-columns: 1fr;
      }

      .topic-head,
      .section-title {
        grid-template-columns: 1fr;
      }

      .topic-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .complete-btn {
        width: 100%;
      }

      .expand-btn {
        width: 100%;
      }

      pre {
        min-height: auto;
        max-height: 340px;
      }
    }

    .drawer.open {
      display: block;
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(21, 23, 17, .36);
    }

    .drawer-panel {
      width: min(360px, calc(100vw - 30px));
      height: 100%;
      overflow: auto;
      border-right: 1px solid var(--border-slate-200);
      background: var(--surface-white);
    }

    .topbar {
      max-width: 1180px;
    }

    .shell {
      grid-template-columns: 280px minmax(0, 1fr);
      max-width: 1180px;
      gap: 24px;
      padding: 24px 18px;
    }

    .side {
      display: block;
      top: 97px;
      height: calc(100dvh - 121px);
    }

    .right-rail,
    .search-row,
    .toolbar-actions,
    .drawer {
      display: none;
    }

    .toc {
      gap: 14px;
      padding: 12px;
    }

    .toc-section {
      display: grid;
      gap: 5px;
    }

    .toc-section-title {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr);
      gap: 8px;
      align-items: center;
      padding: 8px;
      color: var(--text-slate-500);
      font-size: 12px;
      line-height: 16px;
    }

    .toc-section-title span {
      font-family: var(--mono);
      font-size: 11px;
    }

    .toc-section-title b {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 700;
    }

    .toc button {
      grid-template-columns: 28px minmax(0, 1fr);
      min-height: 36px;
    }

    .toc button.done .toc-title::after {
      content: " 已完成";
      color: var(--emerald-500);
      font-size: 11px;
      font-weight: 600;
    }

    .lesson {
      border: 1px solid var(--border-slate-200);
      border-radius: var(--radius-xl);
      background: var(--surface-white);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .lesson-header {
      padding: 32px;
      border-bottom: 1px solid var(--border-slate-200);
      background: linear-gradient(90deg, rgba(99, 102, 241, .08), rgba(56, 189, 248, .08));
    }

    .lesson-kicker {
      margin-bottom: 12px;
      color: var(--indigo-600);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      line-height: 16px;
    }

    .lesson-header h2 {
      max-width: 860px;
      margin: 0;
      color: var(--text-slate-900);
      font-size: 30px;
      font-weight: 800;
      line-height: 36px;
      letter-spacing: 0;
    }

    .lesson-header p {
      max-width: 68ch;
      margin: 12px 0 0;
      color: var(--text-slate-500);
      font-size: 16px;
      line-height: 24px;
    }

    .lesson .topic-meta {
      margin-top: 16px;
    }

    .lesson .compare-grid {
      padding: 24px;
      margin-top: 0;
    }

    .lesson .notes {
      padding: 0 24px 24px;
      margin-top: 0;

    const inlineCodeTerms = [

    function renderInlineCode(value) {
      const terms = [...inlineCodeTerms].sort((a, b) => b.length - a.length);
      const source = escapeHtml(value);
      const alternatives = terms
        .map(term => escapeHtml(term).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"))
        .join("|");
      return source.replace(new RegExp(alternatives, "g"), match => `<code class="inline-code">${match}</code>`);

    }

    function exampleText(topic) {
      const jsLine = firstMeaningfulLine(topic.jsCode);
      const goLine = firstMeaningfulLine(topic.goCode);
      return `比如这节课的左边从 ${jsLine} 开始，右边从 ${goLine} 开始。先不要急着背语法，先看它们各自在强调什么：JS 往往先让事情跑起来，Go 往往先把形状、边界和错误路径摆清楚。`;
    }

    function sectionById(id) {
      return sections.find(section => section.id === id);
    }

    function levelLabel(level) {
      return {
        beginner: "入门",
        intermediate: "进阶",
        advanced: "高级"
      }[level] || level;
    }

    function tagLabel(tag) {
      return {
        syntax: "语法",
        types: "类型",
        runtime: "运行时",
        ecosystem: "生态",
        engineering: "工程",
        performance: "性能"
      }[tag] || tag;
    }

    function renderToc() {
      els.toc.innerHTML = sections.map((section, sectionIndex) => {
        const sectionTopics = topics
          .map((topic, topicIndex) => ({ topic, topicIndex }))
          .filter(item => item.topic.section === section.id);
        return `
          <div class="toc-section">
            <div class="toc-section-title">
              <span>${String(sectionIndex + 1).padStart(2, "0")}</span>
              <b>${renderInlineCode(section.title)}</b>
            </div>
            ${sectionTopics.map(({ topic, topicIndex }) => {
              const active = topicIndex === state.activeTopicIndex ? " active" : "";
              const done = state.completedTopicIds.has(topic.id) ? " done" : "";
              return `
                <button type="button" class="${active}${done}" data-topic-index="${topicIndex}">
                  <span class="toc-num">${String(topicIndex + 1).padStart(2, "0")}</span>
                  <span class="toc-title">${renderInlineCode(topic.title)}</span>
                </button>
              `;
            }).join("")}
          </div>
        `;
      }).join("");
    }

    function renderLesson() {
      const topic = topics[state.activeTopicIndex];
      const section = sectionById(topic.section);
      const done = state.completedTopicIds.has(topic.id);
      const tags = [levelLabel(topic.level), ...topic.tags.map(tagLabel)];
      els.content.innerHTML = `
        <header class="lesson-header">
          <div class="lesson-kicker">${escapeHtml(section.title)} · 第 ${state.activeTopicIndex + 1} / ${topics.length} 课</div>
          <h2>${renderInlineCode(topic.title)}</h2>
          <p>${renderInlineCode(section.summary)}</p>
          <div class="topic-meta">
            ${tags.map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join("")}
          </div>
        </header>

        <section class="compare-grid" aria-label="代码对比">
          <div class="code-card">
            <div class="code-head">
              <span class="lang-js">JavaScript / TypeScript</span>
            </div>
            <pre><code class="language-javascript">${escapeHtml(topic.jsCode)}</code></pre>
          </div>
          <div class="code-card">
            <div class="code-head">
              <span class="lang-go">Go</span>
            </div>
            <pre><code class="language-go">${escapeHtml(topic.goCode)}</code></pre>
          </div>
        </section>

        <section class="notes" aria-label="课程解释">
          <div class="note"><b>这节课在讲什么</b><p>${renderInlineCode(topic.difference)}</p></div>
          <div class="note"><b>举个例子</b><p>${renderInlineCode(exampleText(topic))}</p></div>
          <div class="note"><b>实际写代码时怎么判断</b><p>${renderInlineCode(topic.advice)} ${renderInlineCode(topic.ecosystemNote)}</p></div>
        </section>

        <footer class="lesson-actions">
          <button class="btn" type="button" data-prev ${state.activeTopicIndex === 0 ? "disabled" : ""}>上一课</button>
          <button class="btn primary ${done ? "completed" : ""}" type="button" data-complete-current>
            ${done ? "已完成" : "标记完成"}
          </button>
          <button class="btn" type="button" data-next ${state.activeTopicIndex === topics.length - 1 ? "disabled" : ""}>下一课</button>
        </footer>
      `;
      highlightCodeBlocks();
    }

    function highlightCodeBlocks() {
      if (!window.hljs) return;
      document.querySelectorAll("pre code").forEach(block => {
        block.removeAttribute("data-highlighted");
        window.hljs.highlightElement(block);
      });
    }

    function renderProgress() {
      const done = state.completedTopicIds.size;
      const total = topics.length;
      els.courseProgress.textContent = `${done} / ${total} 已完成`;
    }

    function render() {
      renderLesson();
      renderToc();
      renderProgress();
    }

    function showToast(message) {
      els.toast.textContent = message;
      els.toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => els.toast.classList.remove("show"), 1300);
    }

    function setActiveTopic(index, shouldScroll = true) {
      state.activeTopicIndex = Math.max(0, Math.min(index, topics.length - 1));
      history.replaceState(null, "", `#${topics[state.activeTopicIndex].id}`);
      render();
      if (shouldScroll) window.scrollTo({ top: 0, behavior: "smooth" });
    }

    const hashTopicIndex = topics.findIndex(topic => `#${topic.id}` === window.location.hash);
    if (hashTopicIndex >= 0) state.activeTopicIndex = hashTopicIndex;
    render();
    window.addEventListener("load", highlightCodeBlocks);

    document.addEventListener("click", async event => {
      const topicButton = event.target.closest("[data-topic-index]");
      if (topicButton) {
        setActiveTopic(Number(topicButton.dataset.topicIndex));
        return;
      }

      const complete = event.target.closest("[data-complete-current]");
      if (complete) {
        const id = topics[state.activeTopicIndex].id;
        if (state.completedTopicIds.has(id)) {
          state.completedTopicIds.delete(id);
        } else {
          state.completedTopicIds.add(id);
        }
        saveCompleted();
        render();
        return;
      }

      if (event.target.closest("[data-prev]")) {
        setActiveTopic(state.activeTopicIndex - 1);
        return;
      }

      if (event.target.closest("[data-next]")) {
        setActiveTopic(state.activeTopicIndex + 1);
        return;
      }

    });
  </script>
</body>
</html>
